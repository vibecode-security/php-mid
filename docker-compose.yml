services:
  # Service 1: Cơ sở dữ liệu MySQL / MariaDB chứa dữ liệu sản phẩm, tài khoản, đánh giá (phục vụ SQLi & SQLi File Write)
  mysql:
    image: mariadb:10.11
    container_name: mysql
    entrypoint: ["bash", "-c", "chmod 755 /root && exec docker-entrypoint.sh mariadbd --secure-file-priv='' --local-infile=1"]
    environment:
      MYSQL_ROOT_PASSWORD: root_brewcart_pass
      MYSQL_DATABASE: brewcart
      MYSQL_USER: brewcart_user
      MYSQL_PASSWORD: brewcart_secret_db_2026
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./vulnerable-ipx/uploads:/app/uploads
      - ssh_root_shared:/root/.ssh
    networks:
      - lab-net
    restart: unless-stopped

  # Service 2: Ứng dụng BrewCart E-Commerce PHP MVC & SSH Server (Hỗ trợ truy cập SSH qua mật khẩu 123456789 & SQLi Write Key)
  vulnerable-app:
    build:
      context: ./vulnerable-ipx
      dockerfile: Dockerfile
    container_name: vulnerable-app
    ports:
      - "3000:80"
      - "2022:22"
      - "2222:22"
    environment:
      - DB_HOST=mysql
      - DB_USER=brewcart_user
      - DB_PASSWORD=brewcart_secret_db_2026
      - DB_NAME=brewcart
    depends_on:
      - mysql
    networks:
      - lab-net
    volumes:
      - ./vulnerable-ipx:/var/www/html
      - ./vulnerable-ipx/uploads:/var/www/html/public/uploads
      - ./vulnerable-ipx/uploads:/app/uploads
      - ssh_root_shared:/root/.ssh
    restart: unless-stopped

networks:
  lab-net:
    driver: bridge

volumes:
  ssh_root_shared:
